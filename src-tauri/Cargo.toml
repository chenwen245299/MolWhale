[package]
name = "molwhale"
version = "0.1.0"
description = "MolWhale — conversational molecular design workbench"
authors = []
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "MolWhale"
path = "src/main.rs"

[lib]
name = "molwhale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Smaller, faster release binary: thin LTO + single codegen unit let LLVM
# optimize across crates; strip removes debug symbols (faster cold start).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
